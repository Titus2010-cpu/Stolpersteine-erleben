<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neubrandenburg: Digitale Stolpersteine</title>
    <!-- Verknüpfung zur externen CSS-Datei -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Model-Viewer Skript -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body>

    <header>
        <h1>Neubrandenburg: Digitale Stolpersteine</h1>
        <p class="subtitle">Klicke auf die goldenen Punkte im Modell, um die Biografien zu öffnen.</p>
    </header>

    <div class="viewer-container">
        <!-- 3D Modell (Schatten entfernt mit shadow-intensity="0") -->
        <model-viewer id="stadt-modell" 
                      src="Neubrandenburg2.glb" 
                      alt="3D Stadtmodell von Neubrandenburg" 
                      camera-controls 
                      shadow-intensity="0" 
                      environment-image="neutral" 
                      exposure="1.0">

            <!--Franziska Born -->
            <button class="hotspot-btn"
                    slot="hotspot-1"
                    data-position="-240m 0.2m -85m"
                    data-normal="0m 1m 0m"
                    onclick="openBio('Franziska Born geb. Heine', 'Geboren 1871 in Neubrandenburg. Sie lebte hier bis 1943 und wurde danach nach Auschwitz deportiert. Dieser Stolperstein erinnert an ihr Schicksal.')">
            </button>

            <!--Max Hermann Heine-->
            <button class="hotspot-btn"
                    slot="hotspot-2"
                    data-position="-260m 0.2m -85m "
                    data-normal="0m 1m 0m"
                    onclick="openBio('Max Hermann  Heine', 'Geboren 1863 in Strelitz/Mecklenburg. Er lebte hier bis 1939 und ist danach nach Dänemark geflüchtet. Dieser Stolperstein erinnert an sein Schicksal.')">
            </button>

            <!--Henry Hirschfeld-->
            <button class="hotspot-btn" 
                    slot="hotspot-3"
                    data-position="-270m 0.2m -85m"
                    data-normal="0m 1m 0m"
                    onclick="openBio('Henry Hirschfeld geb. Buchardt', 'Geboren am 3.9.1880 in Neubukow/Mecklenburg. Er lebte hier bis zum 18.11.1941 und wurde danach nach Auschwitz. Dieser Stolperstein erinnert an sein Schicksal.')">
            </button>

            <!--Familie Salamon-->
            <!--Hildegard & Alfred-->
            <button class="hotspot-btn" 
                    slot="hotspot-4" 
                    data-position="-280m 0.2m -85m" 
                    data-normal="0m 1m 0m" 
                    onclick="openBio('Familie Salamon', 'Hildegard Fanni Salamon', 'Geboren 1906 in Neubrandenburg. Sie lebte hier bis 1943 und wurde danach nach Auschwitz deportiert. Dieser Stolperstein erinnert an ihr Schicksal.', 'Alfred Ludwig Salamon', 'Geboren 1902 in Ribnitz/Mecklenburg. Er lebte hier bis 1943 und wurde danach nach Auschwitz deportiert. Dieser Stolperstein erinnert an sein Schicksal.')">
            </button>

            <!--Else Kallmann-->
            <button class="hotspot-btn"
                    slot="hotspot-5"
                    data-position="165m 0.2m 115m "
                    data-normal="0m 1m 0m"
                    onclick="openBio('Else Kallmann geb. Jacob','Geboren am 3. September 1878 in Penzlin. Am 28. März 1942 wurde sie ins Ghetto von ')">
            </button>

            <!--Familie Hoffmann-->
            <!--Magarete & Siegfried-->
            <button class="hotspot-btn"
                    slot="hotspot-6"
                    data-position="380m 0.2m 220m"
                    data-normal="0m 1m 0m"
                    onclick="openBio('Familie Hoffmann', 'Magarete Hoffmann','-','Siegfried Hoffmann','-')">
            </button>

            <!--Jenny Hirsch-->
            <button class="hotspot-btn"
                    slot="hotspot-7"
                    data-position="-575m 0.2m -92.5m"
                    data-normal="0m 1m 0m"
                    onclick="openBio('Jenny Hirsch','-')">
            </button>

            <!--Hanna Löwi-->
            <button class="hotspot-btn"
                    slot="hotspot-8"
                    data-position="-565m 0.2m -120m"
                    data-normal="0m 1m 0m"
                    onclick="openBio('Hanna Löwi','-')">
            </button>

            <!--Mathilde Rosenstein-->
            <button class="hotspot-btn"
                    slot="hotspot-9"
                    data-position="-212.5m 0.2m 17.5m"
                    data-normal="0m 1m 0m"
                    onclick="openBio('Mathilde Rosenstein', '-')">
            </button>

            <!--Familie Meyer-->
            <!--Adolf & Flora & Horst & Paul-->
            <button class="hotspot-btn" 
                    slot="hotspot-10" 
                    data-position="-250m 0.2m 10m" 
                    data-normal="0m 1m 0m"
                    onclick="openBio('Familie Meyer','Adolf Meyer','-','Flora Meyer','-','Horst Meyer','-','Paul Meyer', '-')">
            </button>

            <!--Max Tumbowsky-->
            <button class="hotspot-btn"
                    slot="hotspot-11"
                    data-position="-490m 0.2m 35m"
                    data-normal="0m 1m 0m"
                    onclick="openBio('Max Tumbowsky','-')">
            </button>

            <!--Paula Krasemann-->
            <button class="hotspot-btn"
                    slot="hotspot-12"
                    data-position="-140m 0.2m -425m"
                    data-normal="0m 1m 0m"
                    onclick="openBio('Paula Krasemann', '-')">
            </button>

            <!--Familie Brandwein-->
            <!--Jakob & Mia & Regina-->
            <button class="hotspot-btn"
                    slot="hotspot-13"
                    data-position="-10m 0.2m 115m"
                    data-normal="0m 1m 0m"
                    onclick="openBio('Familie Brandwein','Jakob Brandwein','-','Mia Brandwein','-','Regina Brandwein','-')">
            </button>


        </model-viewer>

        <!-- Zentrale Biografie-Box (für 1 oder mehrere Personen untereinander) -->
        <div id="bio-card" class="bio-card">
            <span class="close-btn" onclick="closeBio()">&times;</span>
            <h3 id="bio-title">Titel</h3>
            <div id="bio-text">Biografie Inhalte...</div>
        </div>
    </div>

    <!-- Verknüpfung zur externen JavaScript-Datei -->
    <script src="script.js"></script>
</body>
</html>
